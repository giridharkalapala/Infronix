<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130" fill="none">
  <defs>
    <!-- Deep Brand Blue -->
    <linearGradient id="igSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055d4" />
      <stop offset="50%" stop-color="#0077f5" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Glowing Spherical Dots for i and G -->
    <radialGradient id="sphereDotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#021b61" />
    </radialGradient>

    <!-- Faceted X Gradient in INFRONIX -->
    <linearGradient id="xGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003db3" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>

    <linearGradient id="xGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" />
      <stop offset="70%" stop-color="#0055d4" />
      <stop offset="100%" stop-color="#021b61" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== LEFT EMBLEM / iG ICON ==================== -->
  <g transform="translate(10, 8)">
    <!-- Outer Swoosh Arc -->
    <path d="M 68 8 C 30 10 5 36 6 72 C 7 98 28 116 58 118 C 34 112 18 95 18 72 C 18 42 38 20 68 18 Z" fill="url(#igSwooshGrad)" />
    <!-- Inner Accent Swoosh Arc -->
    <path d="M 62 108 C 45 106 32 94 28 80 C 32 92 46 102 62 104 Z" fill="#0055d4" opacity="0.9" />

    <!-- i letter in emblem -->
    <!-- dot of i -->
    <circle cx="44" cy="28" r="8" fill="url(#sphereDotGrad)" filter="url(#softGlow)" />
    <!-- stem of i -->
    <path d="M 40 44 L 48 44 C 48 44 48 84 48 92 C 48 94 45 96 42 96 C 39 96 40 44 40 44 Z" fill="#031038" />

    <!-- G letter in emblem -->
    <!-- dot of G (floating top right of G) -->
    <circle cx="78" cy="22" r="8" fill="url(#sphereDotGrad)" filter="url(#softGlow)" />
    <!-- G shape -->
    <path d="M 76 38 C 65 38 56 46 54 60 C 52 76 60 92 76 92 C 86 92 92 84 94 76 L 74 76 L 74 65 L 102 65 C 103 76 100 88 90 98 C 78 106 60 104 46 92 C 34 80 34 56 46 44 C 56 34 70 30 84 32 L 80 40 C 78 39 77 38 76 38 Z" fill="#031038" />
  </g>

  <!-- ==================== WORDMARK: INFRONIX ==================== -->
  <g transform="translate(136, 62)">
    <!-- INFRONI in bold midnight navy -->
    <text x="0" y="0" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="1" fill="#031038">
      INFRONI
    </text>

    <!-- Stylized Modern Faceted X -->
    <g transform="translate(244, -46)">
      <!-- Main Diagonal (Top-Left to Bottom-Right) -->
      <polygon points="4,4 18,4 48,46 34,46" fill="url(#xGrad1)" />
      <!-- Crossing Diagonal (Top-Right to Bottom-Left) -->
      <polygon points="34,4 48,4 18,46 4,46" fill="url(#xGrad2)" opacity="0.95" />
      <!-- Facet Overlay Accent -->
      <polygon points="26,25 48,4 40,4" fill="#38bdf8" opacity="0.6" />
      <polygon points="26,25 4,46 12,46" fill="#00d2ff" opacity="0.5" />
    </g>
  </g>

  <!-- ==================== SUBTITLE: GLOBAL PVT. LTD. ==================== -->
  <g transform="translate(136, 92)">
    <!-- Left Flanking Double Rule -->
    <line x1="0" y1="-8" x2="35" y2="-8" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="-4" x2="35" y2="-4" stroke="#94a3b8" stroke-width="2" />

    <!-- Subtitle Text -->
    <text x="45" y="0" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="21" font-weight="800" letter-spacing="3.5" fill="#031038">
      GLOBAL PVT. LTD.
    </text>

    <!-- Right Flanking Double Rule -->
    <line x1="264" y1="-8" x2="299" y2="-8" stroke="#94a3b8" stroke-width="2" />
    <line x1="264" y1="-4" x2="299" y2="-4" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- ==================== TAGLINE: INNOVATE • INTEGRATE • INSPIRE ==================== -->
  <g transform="translate(160, 118)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" letter-spacing="3" fill="#0055d4">
      INNOVATE &bull; INTEGRATE &bull; INSPIRE
    </text>
  </g>
</svg>
