<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0034a1" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="cloudGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="20" fill="#060c18" stroke="rgba(0, 102, 255, 0.25)" stroke-width="1.5"/>

  <!-- Network Grid Lines -->
  <path d="M150 150 L300 80 L450 150 L450 300 L300 370 L150 300 Z" stroke="#0034a1" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M150 150 L450 300 M450 150 L150 300 M300 80 L300 370" stroke="rgba(0, 102, 255, 0.2)" stroke-width="1.5"/>

  <!-- Center Hybrid Cloud Core -->
  <g transform="translate(300, 225)">
    <circle cx="0" cy="0" r="55" fill="#0b1528" stroke="url(#cloudGrad)" stroke-width="3" filter="url(#cloudGlow)"/>
    <path d="M-22 5 C-22 -8 -10 -18 4 -16 C10 -25 24 -22 28 -12 C36 -12 40 -4 38 4 C44 8 42 20 30 20 L-18 20 C-26 20 -28 10 -22 5 Z" fill="url(#cloudGrad)"/>
    <text x="0" y="38" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">MULTI-CLOUD ENGINE</text>
  </g>

  <!-- Node 1: Kubernetes / CI/CD (Top Left) -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="36" fill="#0b1528" stroke="#0066ff" stroke-width="2"/>
    <text x="0" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">K8s</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">DevOps CI/CD</text>
  </g>

  <!-- Node 2: AWS / Azure Scale (Top Right) -->
  <g transform="translate(450, 150)">
    <circle cx="0" cy="0" r="36" fill="#0b1528" stroke="#00f2fe" stroke-width="2"/>
    <text x="0" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">AWS/Azure</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Scalable Infra</text>
  </g>

  <!-- Node 3: IaC Automation (Bottom Left) -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="36" fill="#0b1528" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Terraform</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">IaC Automation</text>
  </g>

  <!-- Node 4: Observability (Bottom Right) -->
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="36" fill="#0b1528" stroke="#0066ff" stroke-width="2"/>
    <text x="0" y="4" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">24/7 Ops</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Observability</text>
  </g>
</svg>
