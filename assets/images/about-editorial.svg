<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1a3a" />
      <stop offset="100%" stop-color="#002270" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Modern Tech Grid Architecture Background -->
  <g opacity="0.15">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#00f2fe" stroke-width="1" />
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#00f2fe" stroke-width="1" />
  </g>

  <!-- Futuristic Floating Dashboard & AI Layer Visualization -->
  <!-- Layer 1: Data Cube Base -->
  <g transform="translate(160, 120)">
    <!-- Connected isometric data blocks -->
    <polygon points="240,60 400,140 240,220 80,140" fill="#0034a1" opacity="0.6" stroke="#0066ff" stroke-width="2" />
    <polygon points="80,140 240,220 240,340 80,260" fill="#002270" opacity="0.8" stroke="#0066ff" stroke-width="2" />
    <polygon points="240,220 400,140 400,260 240,340" fill="#001a54" opacity="0.9" stroke="#0066ff" stroke-width="2" />

    <!-- Top floating layer -->
    <polygon points="240,0 360,60 240,120 120,60" fill="url(#accentGrad)" opacity="0.85" filter="url(#glowEffect)" />

    <!-- Connected nodes & laser lines -->
    <line x1="240" y1="0" x2="240" y2="120" stroke="#00f2fe" stroke-width="3" stroke-dasharray="4 4" />
    <circle cx="240" cy="0" r="8" fill="#ffffff" filter="url(#glowEffect)" />
    <circle cx="120" cy="60" r="6" fill="#00f2fe" />
    <circle cx="360" cy="60" r="6" fill="#00f2fe" />
    
    <!-- Code / Data Elements -->
    <rect x="20" y="280" width="160" height="70" rx="10" fill="#0b1528" stroke="#0066ff" stroke-width="1.5" />
    <text x="35" y="310" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#00f2fe">CMMI LEVEL 3</text>
    <text x="35" y="332" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Enterprise Delivery</text>

    <rect x="300" y="280" width="160" height="70" rx="10" fill="#0b1528" stroke="#00f2fe" stroke-width="1.5" />
    <text x="315" y="310" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">ISO 9001 &amp; 27001</text>
    <text x="315" y="332" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Certified Security</text>
  </g>
</svg>
