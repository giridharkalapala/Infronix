<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" fill="none">
  <defs>
    <radialGradient id="nodeGlow">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="rgba(0, 102, 255, 0)" />
    </radialGradient>
  </defs>

  <rect width="700" height="400" rx="16" fill="#081022" />

  <!-- Dotted World Map Base -->
  <g opacity="0.3" fill="#38bdf8">
    <!-- North America -->
    <circle cx="140" cy="120" r="3"/><circle cx="160" cy="110" r="3"/><circle cx="180" cy="130" r="3"/>
    <circle cx="150" cy="140" r="3"/><circle cx="130" cy="150" r="3"/><circle cx="170" cy="160" r="3"/>
    <circle cx="190" cy="150" r="3"/><circle cx="210" cy="140" r="3"/><circle cx="160" cy="180" r="3"/>
    
    <!-- South America -->
    <circle cx="220" cy="240" r="3"/><circle cx="240" cy="260" r="3"/><circle cx="230" cy="290" r="3"/><circle cx="250" cy="310" r="3"/>

    <!-- Europe & Middle East -->
    <circle cx="360" cy="110" r="3"/><circle cx="380" cy="100" r="3"/><circle cx="400" cy="120" r="3"/>
    <circle cx="370" cy="140" r="3"/><circle cx="410" cy="150" r="3"/><circle cx="430" cy="170" r="3"/>

    <!-- India & APAC (Main Core Hub) -->
    <circle cx="480" cy="180" r="4"/><circle cx="495" cy="195" r="4"/><circle cx="510" cy="210" r="4"/>
    <circle cx="530" cy="190" r="3"/><circle cx="560" cy="180" r="3"/><circle cx="590" cy="220" r="3"/>
    <circle cx="610" cy="250" r="3"/>
  </g>

  <!-- Connection Arcs & Beams -->
  <!-- India (Hub) to US East -->
  <path d="M495 195 Q 340 60 190 150" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
  <!-- India to Europe (UK/Germany) -->
  <path d="M495 195 Q 430 110 380 100" stroke="#0066ff" stroke-width="2" fill="none" opacity="0.85"/>
  <!-- India to Middle East (Dubai) -->
  <path d="M495 195 Q 460 170 430 170" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- India to APAC (Singapore) -->
  <path d="M495 195 Q 540 230 560 250" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Glowing Hub Pins -->
  <!-- HQ: Hyderabad / Bengaluru (India) -->
  <g transform="translate(495, 195)">
    <circle cx="0" cy="0" r="22" fill="url(#nodeGlow)" />
    <circle cx="0" cy="0" r="7" fill="#00f2fe" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <rect x="12" y="-12" width="135" height="26" rx="6" fill="#0b1528" stroke="#00f2fe" stroke-width="1"/>
    <text x="18" y="5" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#ffffff">HQ &amp; DELIVERY HUB</text>
  </g>

  <!-- US Delivery Node -->
  <g transform="translate(190, 150)">
    <circle cx="0" cy="0" r="14" fill="url(#nodeGlow)" />
    <circle cx="0" cy="0" r="5" fill="#0066ff" />
    <text x="-35" y="-10" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#38bdf8">North America</text>
  </g>

  <!-- Europe Delivery Node -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="14" fill="url(#nodeGlow)" />
    <circle cx="0" cy="0" r="5" fill="#0066ff" />
    <text x="-20" y="-10" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#38bdf8">EMEA</text>
  </g>
</svg>
